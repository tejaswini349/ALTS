<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<style>
body{
    background:#ddd;
}

table{
    border-collapse:collapse;
    width:700px;
    margin:auto;
    background:lightblue;
}

td{
    border:1px solid black;
    padding:8px;
}

h1{
    text-align:center;
}

input, select, textarea{
    width:95%;
}

.submit{
    width:auto;
}
</style>
</head>

<body>

<h1>Candidate Information</h1>

<form>
<table>

<tr>
<td>Name:</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Password:</td>
<td><input type="password"></td>
</tr>

<tr>
<td>Phone Number:</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Gender:</td>
<td>
<input type="radio"> Male
<input type="radio"> Female
</td>
</tr>

<tr>
<td>Date of Birth:</td>
<td><input type="date"></td>
</tr>

<tr>
<td>Email:</td>
<td><input type="email"></td>
</tr>

<tr>
<td>Highest Qualification:</td>
<td>
<select>
<option>Select</option>
<option>B.Tech</option>
<option>B.Sc</option>
<option>MCA</option>
</select>
</td>
</tr>

<tr>
<td>Courses Interested In:</td>
<td>
<input type="checkbox"> Java<br><br>
<input type="checkbox"> HTML<br><br>
<input type="checkbox"> CSS<br><br>
</td>

</tr>

<tr>
<td>Comments:</td>
<td><textarea></textarea></td>
</tr>

<tr>
<td>Upload Certificates:</td>
<td><input type="file"></td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Submit Information" class="submit">
<input type="reset" value="Clear" class="submit">
</td>
</tr>

</table>
</form>

</body>
</html>
