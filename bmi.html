d<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background-color:bisque;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .bmi-card {
            background: #fff;
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            width: 340px;
        }
        
        .bmi-card h2 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
        }
        
        label {
            display: block;
            margin: 16px 0 6px;
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: palevioletred;
        }
        
        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background-color: pink;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        button:hover {
            background-color: powderblue;
        }
        
        #result {
            text-align: center;
            margin: 22px 0 18px;
            font-size: 18px;
            font-weight: 700;
            min-height: 26px;
        }
        
        .guide {
            text-align: center;
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
        }
        
        .guide h4 {
            margin-bottom: 10px;
            font-size: 15px;
            color: #1a1a1a;
        }
        
        .guide p {
            font-size: 12.5px;
            color: #666;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="bmi-card">
        <h2>BMI Calculator</h2>
        
        <label>Height in CM:</label>
        <input type="number" id="height" step="0.1" value="160">
        
        <label>Weight in KG:</label>
        <input type="number" id="weight" step="0.1" value="76">
        
        <button onclick="calculateBMI()">Calculate</button>
        
        <div id="result"></div>
        
        <div class="guide">
            <h4>BMI Weight Guide</h4>
            <p>Under Weight = Less than 18.6</p>
            <p>Normal Range = 18.6 and 24.9</p>
            <p>Overweight = Greater than 24.9</p>
        </div>
    </div>

    <script>
        function calculateBMI() {
            // Get values from inputs
            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);
            const resultEl = document.getElementById('result');
            
            // Check if inputs are valid
            if (!height || !weight || height <= 0 || weight <= 0) {
                resultEl.innerHTML = "Enter valid height and weight";
                resultEl.style.color = "#d32f2f";
                return;
            }
            
            // Calculate BMI: weight(kg) / height(m)²
            const heightM = height / 100;
            const bmi = (weight / (heightM * heightM)).toFixed(2);
            
            // Determine category
            let category = "";
            let color = "";
            
            if (bmi < 18.6) {
                category = "Underweight";
                color = "#2196F3";
            } else if (bmi <= 24.9) {
                category = "Normal Range";
                color = "#4CAF50";
            } else {
                category = "Overweight";
                color = "#FF5722";
            }
            
            // Show result
            resultEl.innerHTML = `BMI: ${bmi} (${category})`;
            resultEl.style.color = color;
        }
    </script>
</body>
</html>
