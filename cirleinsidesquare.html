<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle inside a square</title>
</head>
<style>
    .rectangle {
        border-radius: 10px;
        display: inline-block;
        width: 205px;
        height: 205px;
        border: 1px solid #000;
        background-color: white;
    }
    .rectangle::before {
        display: block;
        position: absolute;
        left: 10px;
        top: 10px;
        content:"";
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background-color: red;
    } 
</style>
<body>
    <div class="rectangle"> </div>
</body>
</html>
