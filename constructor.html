<!DOCTYPE html>
<html>
    <body>
        <script>
            class Car {
                constructor(name) {
                    this.brand=name;
                }
            }
            const myCar = new Car("Ford");
            document.write(myCar.brand);
            const myCar1 = new Car("BMW");
            document.write("<br>"+myCar1.brand);
            const myCar2 = new Car("Audi");
            document.write("<br>"+myCar2.brand);
        </script>
    </body>
</html>
