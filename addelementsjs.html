<!DOCTYPE html>
<html>
    <head>
        <title> Array Example </title>
        <body>
            <h3>Array Example </h3>
            <script>
                var color1 = ["Red" , "Blue", "Green"];
                document.write(color1);
                document.write("<br>");
                document.write(color1[0]+"<br>")
                document.write(color1[1]+"<br>")
                document.write(color1[2]+"<br>")
                document.write("<br>");
                color1.push("yellow");
                document.write(color1);
                document.write("<br>");
                </script>
        </body>
    </head>
</html>
